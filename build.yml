name: Build Prometheus Chess Engine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Permet de lancer manuellement depuis GitHub

jobs:
  build-windows:
    name: Windows x64 (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Compile prometheus.exe
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O3 -march=x86-64 \
              -o prometheus.exe prometheus.cpp \
              -lpthread -static
          echo "Build OK"
          ls -lh prometheus.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-windows-x64
          path: prometheus.exe
          retention-days: 30

  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile prometheus
        run: |
          g++ -std=c++17 -O3 -march=x86-64 \
              -o prometheus prometheus.cpp \
              -lpthread -static
          echo "Build OK"
          ls -lh prometheus

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-linux-x64
          path: prometheus

  build-macos:
    name: macOS (Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile prometheus
        run: |
          g++ -std=c++17 -O3 \
              -o prometheus prometheus.cpp
          echo "Build OK"
          ls -lh prometheus

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-macos
          path: prometheus
